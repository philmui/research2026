[pytest]
# Pytest configuration for emotion detector project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Coverage options
    --cov=asdrp
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    # Show local variables in tracebacks
    --showlocals
    # Strict markers
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Coverage configuration
[coverage:run]
source = asdrp
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */.venv/*

[coverage:report]
# Fail if coverage is below 85%
fail_under = 85
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    def __str__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod
    # Don't complain about type checking code
    if TYPE_CHECKING:
    # Don't complain about ellipsis in protocols
    \.\.\.

[coverage:html]
directory = htmlcov

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for module interactions
    e2e: End-to-end tests for complete workflows
    slow: Tests that take a long time to run
    requires_model: Tests that require the MediaPipe model file
    requires_video: Tests that require video files
    requires_camera: Tests that require camera access
    visual: Tests that produce visual output

# Minimum Python version
minversion = 3.12

# Consider test discovery patterns
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    .venv
    __pycache__
    output
    data
    notebooks
    docs

# Timeout for tests (in seconds)
timeout = 300

# Logging
log_cli = False
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Disable warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning:mediapipe.*
    ignore::PendingDeprecationWarning:torch.*
    ignore::UserWarning:cv2.*
